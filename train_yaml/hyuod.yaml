# Ultralytics YOLO, AGPL-3.0 license
# RGB-input HyUOD ablation: P4 physical structure with lightweight P3/P4 edge refinement.

# Parameters
ch: 3
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, PhysicsTA, [9]]
  - [0, 1, t_head, [64]]
  - [0, 1, A_head, [32]]
  - [0, 1, First_Conv, [64, 3, 2]] # 3-P1/2

  # P2/4
  - [1, 1, t_block, [64]]
  - [2, 1, A_block, [64, 1]]
  - [3, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [[-1, 4, 5], 1, Concat, [1]]
  - [-1, 1, frequent_block, [256, 0.25]]

  # P3/8: add edge refinement for small-object boundary quality.
  - [4, 1, t_block, [128]]
  - [2, 1, A_block, [64, 2]]
  - [9, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [[-1, 10, 11], 1, Concat, [1]]
  - [-1, 1, frequent_block, [512, 0.25]]
  - [-1, 1, EdgeRefine, [512]]

  # P4/16: keep physical alignment, then sharpen mid-deep boundaries.
  - [10, 1, t_block, [256]]
  - [2, 1, A_block, [64, 3]]
  - [16, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [[-1, 17, 18], 1, Concat, [1]]
  - [-1, 1, frequent_block, [512]]
  - [-1, 1, EdgeRefine, [512]]

  # P5/32: keep light to retain a parameter reduction against baseline.
  - [23, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 23], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 16], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 30], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 27], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[33, 36, 39], 1, Detect, [nc]]
