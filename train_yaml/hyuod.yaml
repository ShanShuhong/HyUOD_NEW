# Ultralytics YOLO, AGPL-3.0 license
# Target-background separated feature extraction based on the good aligned in-network T/A baseline.

# Parameters
ch: 3
nc: 80
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, PhysicsTABaseline, [9]]
  - [0, 1, t_head, [64]]
  - [0, 1, A_head, [32]]
  - [0, 1, First_Conv, [64, 3, 2]] # 3-P1/2

  # P2/4
  - [1, 1, t_block, [64]]
  - [2, 1, A_block, [64, 1]]
  - [3, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [[-1, 4, 5], 1, Concat, [1]]
  - [-1, 1, TBSepFrequentBlock, [256, 0.25, 7, 0.25]] # 9

  # P3/8
  - [4, 1, t_block, [128]]
  - [2, 1, A_block, [64, 2]]
  - [9, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [[-1, 10, 11], 1, Concat, [1]]
  - [-1, 1, TBSepFrequentBlock, [512, 0.25, 7, 0.25]] # 15

  # P4/16
  - [10, 1, t_block, [256]]
  - [2, 1, A_block, [64, 3]]
  - [15, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [[-1, 16, 17], 1, Concat, [1]]
  - [-1, 1, frequent_block, [512]] # 21

  # P5/32
  - [21, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 25

head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 28

  # P4 -> P3, align high-level feature to the P3 spatial reference.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 15], 1, SmallAlignConcat, [1.0]]
  - [-1, 2, C3k2, [256, False]] # 31

  # P3 -> P2/4-small, align high-level feature to the P2 spatial reference.
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, SmallAlignConcat, [1.0]]
  - [-1, 2, C3k2, [256, False]] # 34 (P2/4-small)

  # P2 -> P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 31], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]] # 37 (P3/8-small)

  # P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 28], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 40 (P4/16-medium)

  # P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 25], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 43 (P5/32-large)

  - [[34, 37, 40, 43], 1, Detect, [nc]]