# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. Optimized for UnderWater Object Detection.

# Parameters
ch: 9
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] 
  s: [0.50, 0.50, 1024] 
  m: [0.50, 1.00, 512] 
  l: [1.00, 1.00, 512] 
  x: [1.00, 1.50, 512] 

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Input_agent, []]
  - [0, 1, t_head, [64]]
  - [0, 1, A_head, [32]]
  - [0, 1, First_Conv, [64, 3, 2]] # 3-P1/2

  # --- P2/4 浅层特征区 ---
  - [1, 1, t_block, [64]]
  - [2, 1, A_block, [64, 1]]
  - [-3, 1, Conv, [128, 3, 2]] # 6-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [[-1, -4, -3], 1, Concat, [1]]
  - [-1, 1, frequent_block, [256, 0.25]] # 9 -> 挂载新版柔光融合块：对齐浅层模态

  # --- P3/8 中层特征区（海胆、海星、小扇贝黄金分辨率层） ---
  - [-6, 1, t_block, [128]]
  - [2, 1, A_block, [64, 2]]
  - [-3, 1, Conv, [256, 3, 2]] # 12-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [[-1, -4, -3], 1, Concat, [1]]
  - [-1, 1, frequent_block, [512, 0.25]] # 15 -> 挂载新版柔光融合块：全力柔光去雾

  # --- P4/16 中深层特征区（海参及宏观弱边缘层：开始全面保护大语义） ---
  - [-6, 1, t_block, [256]]
  - [2, 1, A_block, [64, 3]]
  - [-3, 1, Conv, [512, 3, 2]] # 18-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [[-1, -4, -3], 1, Concat, [1]]
  # 【修改点 1】此处移除原先的 frequent_block，改回原版标准 C3k2 算子
  # 避免深层连续注意力降噪把海参、大扇贝的弱边缘信号直接洗掉
  - [-1, 2, C3k2, [512, False]] # 21 (替换原有的 frequent_block)

  # --- P5/32 特深大语义区 ---
  - [-6, 1, t_block, [512]]
  - [2, 1, A_block, [64, 4]]
  - [-3, 1, Conv, [1024, 3, 2]] # 24-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [[-1, -4, -3], 1, Concat, [1]]
  # 【修改点 2】此处同样改回标准 C3k2，让最宏观的轮廓特征可以高保真流向检测头
  - [-1, 2, C3k2, [1024, True]] # 27 (替换原有的 frequent_block)

  - [-1, 1, SPPF, [1024, 5]] # 28
  - [-1, 2, C2PSA, [1024]] # 29

# YOLO11n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 21], 1, Concat, [1]] # cat backbone P4 -> 对应主干第 21 层的高保真特征
  - [-1, 2, C3k2, [512, False]] # 32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 15], 1, Concat, [1]] # cat backbone P3 -> 对应主干第 15 层的柔光增强特征
  - [-1, 2, C3k2, [256, False]] # 35 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 32], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 38 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 29], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 41 (P5/32-large)

  - [[35, 38, 41], 1, Detect, [nc]] # Detect(P3, P4, P5)